name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: TypeScript, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Enable Bubblewrap review sandbox
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: nix develop . -c npm run check
      - run: npm run test:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
      - run: npm run build
      - run: npm run audit

  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable Bubblewrap review sandbox
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix flake check
      - run: nix build .#piss
