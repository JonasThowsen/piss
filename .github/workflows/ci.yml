name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: OCaml tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable Bubblewrap review sandbox
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix develop . -c just check

  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable Bubblewrap review sandbox
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix flake check
      - run: nix build .#piss
